<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {% endif %}DeforaSec</title>
  <meta name="description" content="DeforaSec — Security research, vulnerability discovery, penetration testing, and open-source security tooling.">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        <img class="org-logo" src="{{ '/assets/img/logo.png' | relative_url }}" alt="DeforaSec" onerror="this.style.display='none'">
        <span class="brand">DeforaSec</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/expertise' | relative_url }}">Expertise</a>
        <a href="{{ '/writeups' | relative_url }}">Writeups</a>
        <a href="{{ '/contributions' | relative_url }}">Open Source</a>
        <a href="{{ '/about' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <strong>DeforaSec</strong>
          <p>Security research and vulnerability discovery.</p>
        </div>
        <div>
          <strong>Explore</strong>
          <a href="{{ '/expertise' | relative_url }}">Expertise</a>
          <a href="{{ '/writeups' | relative_url }}">Writeups</a>
          <a href="{{ '/contributions' | relative_url }}">Open Source</a>
        </div>
        <div>
          <strong>Connect</strong>
          <a href="https://github.com/SajanGhimire1" target="_blank">GitHub</a>
          <a href="https://medium.com/@inksecghiwir3" target="_blank">Medium</a>
          <a href="https://www.linkedin.com/in/54j4n/" target="_blank">LinkedIn</a>
          <a href="https://x.com/QuietEcho18" target="_blank">X / Twitter</a>
        </div>
      </div>
      <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} DeforaSec. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
